plugins { id 'com.android.application' }

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def mapboxPublicToken = localProperties.getProperty('MAPBOX_PUBLIC_TOKEN', System.getenv('MAPBOX_PUBLIC_TOKEN') ?: '')

android {
    namespace 'cl.clarify.app'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.clarify.app'
        minSdk 26
        targetSdk 35
        versionCode 27
        versionName '1.3.5'
        buildConfigField 'String', 'MAPBOX_PUBLIC_TOKEN', "\"${mapboxPublicToken}\""
    }

    buildFeatures { buildConfig true }
    sourceSets { main { assets.srcDirs = ['../../public'] } }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
