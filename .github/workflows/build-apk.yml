name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'public/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          echo "Keystore size: $(stat -c%s ~/.android/debug.keystore 2>/dev/null || echo 0) bytes"
          keytool -J-Duser.language=en -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android 2>&1 | grep -i "SHA1:" || echo "WARNING: DEBUG_KEYSTORE_BASE64 secret is missing, empty, or not a valid keystore -- a fresh throwaway debug keystore will be auto-generated instead, which will NOT match any signature registered elsewhere (Google Cloud OAuth, an already-installed APK, etc.)"

      - name: Build debug APK
        working-directory: android-app
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clarify-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
